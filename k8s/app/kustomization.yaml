# 서버 앱: kubectl apply -k k8s/app
# 네임스페이스와 PVC는 k8s/setup, 비밀번호는 Secret(cashbook-secret)으로 먼저 만든다 (README 참고).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cashbook

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Traefik(k3s 기본)용 HTTP → HTTPS 리다이렉트. ingress-nginx면 이 줄을 지운다.
components:
  - traefik

# Docker Hub의 서버 이미지. k8s/docker/build_and_push.sh가 빌드·푸시한 뒤 newTag를 바꾼다
images:
  - name: cashbook-server
    newName: rouddy/cashbook
    newTag: "0.1.4"
