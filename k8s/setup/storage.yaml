# 데이터를 담는 PVC 두 개. 앱(k8s/app kustomization)과 따로 두어
# `kubectl delete -k k8s/app`으로 앱을 지워도 DB와 웹 빌드는 남는다.
#
# - 둘 다 ReadWriteOnce: 서버는 한 개만 뜨고(SQLite 단일 쓰기), 같은 노드의 도구 Pod만 함께 마운트한다.
# - storageClassName을 비우면 클러스터 기본 StorageClass를 쓴다 (k3s: local-path).
#   SQLite는 파일 잠금에 의존하므로 NFS·SMB 같은 네트워크 파일시스템 대신 블록/로컬 스토리지를 쓴다.
# - 지워지면 안 되는 데이터이므로 reclaimPolicy가 Retain인 StorageClass를 권장한다 (README "데이터 보존" 참고).

# SQLite DB(/data/cashbook.db)와 세션 키(/data/secret.key), 복원 전 백업(/data/backups)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cashbook-data
  namespace: cashbook
  labels:
    app.kubernetes.io/name: cashbook
    app.kubernetes.io/component: data
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# 웹 빌드(web/dist). /web/releases/<릴리스>/ 에 올리고 /web/current 링크로 현재 릴리스를 가리킨다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cashbook-web
  namespace: cashbook
  labels:
    app.kubernetes.io/name: cashbook
    app.kubernetes.io/component: web
spec:
  accessModes: [ReadWriteOnce]
  # storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
