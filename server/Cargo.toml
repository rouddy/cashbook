[package]
name = "cashbook-server"
version = "0.1.1"
edition = "2024"
description = "가계부 서비스 백엔드 (Rocket + async-graphql + SeaORM, SQLite/MySQL)"

[[bin]]
name = "cashbook"
path = "src/main.rs"

[dependencies]
async-graphql = { version = "7.2.1", features = ["chrono"] }
async-graphql-rocket = "7.2.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
hex = "0.4"
rand = "0.9"
regex = "1"
rocket = { version = "0.5.1", features = ["json", "secrets"] }
sea-orm = { version = "2.0.4", features = ["sqlx-sqlite", "sqlx-mysql", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
sea-orm-migration = { version = "2.0.4", features = ["sqlx-sqlite", "sqlx-mysql", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
